[package]
name = "spectrum-revisions"
version = "0.1.0"
edition.workspace = true
description = "App-neutral durable revision storage for Spectrum creative tools"
license.workspace = true
repository.workspace = true

[features]
default = ["storage"]
storage = [
    "dep:fs2",
    "dep:libc",
    "dep:rusqlite",
    "dep:serde_json",
    "dep:url",
    "dep:windows-sys",
]

[dependencies]
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
uuid.workspace = true
fs2 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "revision-benchmark"
path = "src/bin/revision-benchmark.rs"
required-features = ["storage"]
