[package]
name = "spectrum"
version = "0.1.0"
edition.workspace = true
description = "The Spectrum command line and library service"
license.workspace = true
repository.workspace = true

[dependencies]
spectrum-library = { path = "../../crates/spectrum-library" }
anyhow.workspace = true
clap.workspace = true
base64.workspace = true
chrono.workspace = true
epaint_default_fonts.workspace = true
flate2.workspace = true
fs2.workspace = true
image.workspace = true
lumen-photo = { path = "../lumen" }
png.workspace = true
prism = { path = "../prism" }
rayon.workspace = true
same-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
spectrum-imaging = { path = "../../crates/spectrum-imaging" }
spectrum-live-bridge = { path = "../../crates/spectrum-live-bridge" }
spectrum-revisions = { path = "../../crates/spectrum-revisions" }
tiff = "0.11.3"
unicode-linebreak.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3.27"

[[bin]]
name = "spectrum"
path = "src/cli.rs"
