name: Mac input debug
on:
  push:
    branches: [debug/mac-input]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [width, wrapped]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --release -p spectrum-desktop
      - name: Probe the branch name field with screenshots
        env:
          SPECTRUM_INPUT_PROBE: "1"
          SPECTRUM_INPUT_VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p shots
          (i=0; while [ $i -lt 400 ]; do screencapture -x -C shots/$(printf %04d $i).png || true; i=$((i+1)); sleep 0.25; done) &
          target/release/spectrum-desktop --benchmark --profile ci --only history --report report.json 2> app.err || true
          grep -E "INPUTDBG|PROBE" app.err | head -20000 > inputdbg.txt || true
          kill %1 || true
          cat app.err | grep -E "PROBE|spectrum:" || true
          ls shots | wc -l
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-${{ matrix.variant }}
          path: |
            shots
            app.err
            inputdbg.txt
