name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RUST_TEST_THREADS: 4

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libssl-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Enforce workspace architecture guardrails
        run: cargo test -p workspace-guardrails --locked
      - run: cargo test --workspace --all-targets --locked

  interaction:
    name: Interaction benchmark (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GPUI dependencies and software rendering
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libssl-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev xvfb mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Metal compiler is available
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Storage budgets for editing
        run: cargo test -p spectrum-assets --test interaction_costs --locked
      - name: Edits reach the screen within budget
        run: bash scripts/interaction-benchmark.sh --profile ci --report interaction-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interaction-report-${{ matrix.label }}
          path: interaction-report.json
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libssl-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Metal compiler is available
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - run: cargo build --release -p spectrum-desktop -p spectrum --locked
      - name: Install Developer ID certificate
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SPECTRUM_MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.SPECTRUM_MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SPECTRUM_MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ vars.SPECTRUM_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${CERT_BASE64:?missing SPECTRUM_MACOS_CERT_P12_BASE64}"
          : "${P12_PASSWORD:?missing SPECTRUM_MACOS_CERT_PASSWORD}"
          : "${TEAM_ID:?missing SPECTRUM_APPLE_TEAM_ID}"
          certificate="$RUNNER_TEMP/spectrum-developer-id.p12"
          keychain="$RUNNER_TEMP/spectrum-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERT_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -v team="($TEAM_ID)" 'index($0, "Developer ID Application:") && index($0, team) { print $2 }')"
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]] || { echo "expected one Developer ID Application identity for team $TEAM_ID" >&2; exit 1; }
          echo "SPECTRUM_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SPECTRUM_APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
      - name: Package Spectrum
        shell: bash
        run: bash scripts/package-spectrum.sh
      - name: Notarize Spectrum.app
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SPECTRUM_MACOS_SIGNING_ENABLED == 'true'
        env:
          SPECTRUM_APPLE_ID: ${{ secrets.SPECTRUM_APPLE_ID }}
          SPECTRUM_APPLE_APP_PASSWORD: ${{ secrets.SPECTRUM_APPLE_APP_PASSWORD }}
        run: bash scripts/notarize-spectrum-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: spectrum-${{ matrix.label }}
          path: target/dist/
          if-no-files-found: error
      # A fixed download link for reviewing main: releases/download/preview/<zip>.
      - name: Publish signed Mac preview
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.SPECTRUM_MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=target/dist/Spectrum-macos-notarized.zip
          test -f "$file"
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --target "$GITHUB_SHA" \
              --title "Spectrum preview" --notes "Latest signed Mac preview from main."
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" \
            -f sha="$GITHUB_SHA" -F force=true
          gh release edit preview --notes "Latest signed Mac preview, built from $GITHUB_SHA."
          gh release upload preview "$file" --clobber
