[workspace]
members = [
    "apps/spectrum",
    "apps/spectrum-desktop",
    "crates/spectrum-assets",
    "crates/spectrum-canvas",
    "crates/spectrum-image",
    "crates/spectrum-imaging",
    "crates/spectrum-library",
    "crates/spectrum-fonts",
    "crates/spectrum-revisions",
    "crates/spectrum-live-bridge",
    "tools/workspace-guardrails",
]
exclude = ["third_party/hb-subset"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bentsignal/spectrum"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
epaint_default_fonts = "0.35"
flate2 = "1.1"
fs2 = "0.4"
fontdue = "0.9"
getrandom = "0.3"
hmac = "0.13"
hb-subset = { version = "=0.3.0", path = "third_party/hb-subset", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
icu_locale = "=2.2.0"
icu_locale_core = "=2.2.0"
libc = "0.2"
png = "0.18.1"
rawler = "0.7.2"
rayon = "1.12"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ttf-parser = "0.21.1"
fontdb = "0.23"
unicode-bidi = "=0.3.18"
unicode-linebreak = "=0.1.5"
unicode-script = "=0.5.8"
unicode-segmentation = "=1.13.3"
uuid = { version = "1.24", features = ["serde", "v4"] }
url = "2.5"
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
